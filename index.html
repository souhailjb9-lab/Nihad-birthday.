<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nihad</title>
    
    <!-- مكتبة المفرقعات -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* التنسيق الأساسي للموقع للحفاظ على جمالية الخط والتصميم */
        body {
            background-color: #111; /* خلفية داكنة */
            color: white;
            font-family: 'Impact', 'Arial Black', sans-serif; /* خط عريض وجميل مشابه للصورة */
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* إخفاء العناصر غير النشطة */
        .hidden {
            display: none !important;
        }

        /* تنسيق شاشة العد التنازلي */
        #main-container {
            font-family: sans-serif;
        }

        #countdown-timer {
            font-size: 2rem;
            margin-top: 20px;
            font-weight: bold;
        }

        /* تنسيق شاشة الاحتفال */
        #celebration-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #celebration-container h1 {
            font-size: 3.5rem;
            margin: 10px 0;
            line-height: 1.2;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .cake-emoji {
            font-size: 6rem;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* تنسيق زر الصوت */
        #startMusicBtn {
            background-color: #ff69b4; /* لون وردي */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Arial', sans-serif; /* خط الزر واضح */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s;
            z-index: 20;
        }

        #startMusicBtn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- شاشة العد التنازلي -->
    <!-- ========================================== -->
    <div id="main-container">
        <h2>Countdown to Nihad's Birthday</h2>
        <div id="countdown-timer">
            <!-- سيتم تحديث هذه الأرقام بواسطة الجافاسكريبت -->
            <span id="days">00</span>d : 
            <span id="hours">00</span>h : 
            <span id="minutes">00</span>m : 
            <span id="seconds">00</span>s
        </div>
    </div>

    <!-- ========================================== -->
    <!-- شاشة الاحتفال (تظهر بعد انتهاء العداد) -->
    <!-- ========================================== -->
    <div id="celebration-container" class="hidden">
        <h1>Happy<br>Birthday<br>Nihad!</h1>
        <div class="cake-emoji">🎂</div>
        
        <!-- ملف الصوت -->
        <audio id="bdayAudio" src="nina.mp3" preload="auto" loop></audio>
        
        <!-- زر تشغيل الصوت -->
        <button id="startMusicBtn">🎵 اضغط هنا لبدء الاحتفال 🎵</button>
    </div>

    <!-- ========================================== -->
    <!-- أكواد الجافاسكريبت (العداد + المفرقعات + الصوت) -->
    <!-- ========================================== -->
    <script>
        // 1. ضع تاريخ ميلاد نهاد هنا بدقة
        const targetDate = new Date("August 02, 2026 20:12:00").getTime(); 

        // إعدادات مكتبة المفرقعات
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // دالة المفرقعات القوية عند البداية
        function startFireworks() {
            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // دالة مفرقعات هادئة متكررة
        function subtleFireworks() {
            confetti({
                particleCount: 20,
                spread: 120,
                origin: { y: 0.6 }
            });
        }

        let countdownTimer;
        let subtleInterval;

        // دالة العداد التنازلي
        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // تحديث الأرقام على الشاشة (إذا كان العداد ما زال يعمل)
            if (distance > 0) {
                document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            } 
            // عند انتهاء العداد
            else {
                if (countdownTimer) clearInterval(countdownTimer);
                if (subtleInterval) clearInterval(subtleInterval);
                
                // إخفاء العداد وإظهار الاحتفال
                document.getElementById('main-container').classList.add('hidden');
                document.getElementById('celebration-container').classList.remove('hidden');

                // تشغيل المفرقعات الكثيفة مرة واحدة
                startFireworks();
                
                // تشغيل مفرقعات خفيفة كل 5 ثواني ليبقى الموقع حياً
                setInterval(subtleFireworks, 5000);
            }
        }

        // تشغيل العداد فور فتح الصفحة
        countdownTimer = setInterval(updateTimer, 1000);
        updateTimer(); // استدعاء فوري لتجنب التأخير لثانية واحدة

        // 2. كود تشغيل الصوت والزر الآمن
        document.addEventListener("DOMContentLoaded", function() {
            const musicBtn = document.getElementById("startMusicBtn");
            const audio = document.getElementById("bdayAudio");

            if (musicBtn) {
                musicBtn.addEventListener("click", function() {
                    if (audio) {
                        audio.play(); // تشغيل الصوت
                        this.style.display = "none"; // إخفاء الزر لتبقى الشاشة نظيفة
                    }
                });
            }
        });
    </script>
</body>
</html>
